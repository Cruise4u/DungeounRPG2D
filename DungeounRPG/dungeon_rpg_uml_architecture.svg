<svg viewBox="0 0 1700 1300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>UML class diagram of DungeounRPG project</title>
<desc>Class diagram showing Character, Combat, Team, Actions/Skills, Grid, Controller, Input, UI and Events subsystems with inheritance and association relationships.</desc>
<defs>
<marker id="tri" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#ffffff" stroke="#333333"/></marker>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#666666" stroke-width="1.3"/></marker>
</defs>
<style>
.box{fill:#f5f5f5;stroke:#999999;stroke-width:1.2;}
.hdr{fill:#dce8f5;stroke:#999999;stroke-width:1.2;}
.title{font:bold 13px sans-serif;fill:#111111;}
.itf{font:italic bold 12px sans-serif;fill:#111111;}
.body{font:11px monospace;fill:#444444;}
.sec{font:11px sans-serif;fill:#666666;}
.inh{stroke:#333333;stroke-width:1.4;fill:none;marker-end:url(#tri);}
.assoc{stroke:#888888;stroke-width:1.1;fill:none;marker-end:url(#arr);stroke-dasharray:3,2;}
.label{font:11px sans-serif;fill:#666666;}
</style>
<rect width="1700" height="1300" fill="#ffffff"/>

<text x="20" y="26" class="sec" font-size="13">Subsystems: Character • Combat/Team • Actions &amp; Skills • Grid • Controllers/Input • UI • Events (legend: solid arrow = inherits, dashed arrow = uses/has-a)</text>

<g>
<rect x="20" y="50" width="230" height="64" class="hdr"/>
<text x="30" y="68" class="title">Character</text>
<text x="30" y="84" class="body">+ Stats: CharacterStats</text>
<text x="30" y="98" class="body">+ TakeTurn(): IEnumerator</text>
<rect x="20" y="50" width="230" height="64" class="box" fill="none"/>

<rect x="20" y="150" width="230" height="40" class="box"/>
<text x="30" y="168" class="title">PlayerCharacter</text>
<text x="30" y="182" class="body">+ EndTurn()</text>

<rect x="280" y="150" width="230" height="48" class="box"/>
<text x="290" y="168" class="title">AICharacter</text>
<text x="290" y="182" class="body">- controller: AIController</text>

<rect x="20" y="230" width="230" height="80" class="box"/>
<text x="30" y="248" class="title">CharacterStats</text>
<text x="30" y="262" class="body">MaxHp/CurrentHp/Atk/Armor</text>
<text x="30" y="276" class="body">+ TakeDamage(int)</text>
<text x="30" y="290" class="body">+ Heal(int)</text>
<text x="30" y="303" class="body">→ baseStats: CharacterStatsSO</text>

<rect x="280" y="230" width="230" height="36" class="box"/>
<text x="290" y="248" class="title">CharacterStatsSO</text>
<text x="290" y="261" class="body">maxHp, attackPower, armor</text>

<rect x="20" y="330" width="230" height="60" class="box"/>
<text x="30" y="348" class="title">CharacterToken</text>
<text x="30" y="362" class="body">EvolutionType, poolId</text>
<text x="30" y="376" class="body">+ SetSlot()/SetEvolution()</text>

<rect x="280" y="330" width="230" height="56" class="box"/>
<text x="290" y="348" class="title">CharacterSlot</text>
<text x="290" y="362" class="body">OccupantToken/Character</text>
<text x="290" y="376" class="body">+ Occupy()/Vacate()</text>

<rect x="20" y="410" width="490" height="50" class="box"/>
<text x="30" y="428" class="title">CharacterTokenMerger</text>
<text x="30" y="442" class="body">+ MergeTokens(from,to): bool   + SpawnInCombatZone()</text>

<rect x="560" y="50" width="190" height="64" class="box"/>
<text x="570" y="68" class="itf">«interface» ITarget</text>
<text x="570" y="84" class="body">TakeDamage(int)</text>
<text x="570" y="98" class="body">Heal(int) / GetSE()</text>
</g>

<path d="M100,150 L100,114" class="inh"/>
<path d="M395,150 L160,114" class="inh"/>
<path d="M250,82 L560,82" class="assoc"/>

<g>
<rect x="800" y="50" width="230" height="64" class="box"/>
