<text x="570" y="626" class="body">→ tokenMerger, ITokenInputProvider</text>
<text x="570" y="640" class="body">+ BeginTargeting()/EndTurn()</text>
<text x="570" y="654" class="body">+ TryBeginDrag()/EndDrag()</text>

<rect x="820" y="580" width="200" height="56" class="box"/>
<text x="830" y="598" class="title">AIController</text>
<text x="830" y="612" class="body">strategy: AITargetStrategy</text>
<text x="830" y="626" class="body">+ PerformAction()</text>

<path d="M670,580 L670,550" class="inh"/>
<path d="M900,580 L700,550" class="inh"/>

<rect x="820" y="660" width="200" height="40" class="box"/>
<text x="830" y="678" class="itf">«interface»</text>
<text x="830" y="692" class="itf">ITokenInputProvider</text>

<rect x="820" y="720" width="95" height="36" class="box"/>
<text x="828" y="738" class="title" font-size="11">MouseInputProvider</text>
<rect x="925" y="720" width="95" height="36" class="box"/>
<text x="933" y="738" class="title" font-size="11">TouchInputProvider</text>
