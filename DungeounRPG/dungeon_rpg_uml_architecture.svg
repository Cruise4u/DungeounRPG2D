<text x="30" y="642" class="body">members: List&lt;Character&gt;</text>
<text x="30" y="656" class="body">+ AddMember()/RemoveMember()</text>

<rect x="20" y="700" width="100" height="40" class="box"/>
<text x="30" y="718" class="title">PlayerTeam</text>
<text x="30" y="732" class="body">Select()</text>
<rect x="150" y="700" width="100" height="40" class="box"/>
<text x="160" y="718" class="title">AITeam</text>

<path d="M70,700 L100,674" class="inh"/>
<path d="M180,700 L160,674" class="inh"/>
<path d="M250,540 L20,540" class="assoc"/>
<path d="M130,610 L130,580" class="assoc" />
