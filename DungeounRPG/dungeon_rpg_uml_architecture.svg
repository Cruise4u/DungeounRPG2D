<text x="1170" y="276" class="body">+ TickEffects()</text>

<rect x="1160" y="310" width="180" height="48" class="box"/>
<text x="1170" y="328" class="title">SkillSlot</text>
<text x="1170" y="342" class="body">equippedSkills: List&lt;SkillSO&gt;</text>
</g>

<g>
