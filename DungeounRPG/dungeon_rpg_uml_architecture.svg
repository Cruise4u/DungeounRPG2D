<text x="810" y="261" class="body">ExecuteSkill()</text>

<rect x="800" y="290" width="150" height="36" class="box"/>
<text x="810" y="308" class="title">HolyLightSkill</text>
<text x="810" y="321" class="body">damage, stunRounds</text>
<path d="M860,290 L860,266" class="inh"/>

<rect x="980" y="230" width="150" height="36" class="box"/>
