<text x="810" y="98" class="body">+ Execute(user, targets)</text>

<rect x="800" y="150" width="150" height="40" class="box"/>
<text x="810" y="168" class="title">DamageActionSO</text>
<text x="810" y="182" class="body">DamageMultiplier</text>

<rect x="960" y="150" width="150" height="40" class="box"/>
<text x="970" y="168" class="title">HealActionSO</text>
