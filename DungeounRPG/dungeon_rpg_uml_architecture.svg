<path d="M972,720 L880,696" class="inh"/>
<path d="M790,650 L820,680" class="assoc"/>
</g>

<g>
<rect x="1090" y="500" width="240" height="76" class="box"/>
<text x="1100" y="518" class="title">GridManager «singleton»</text>
<text x="1100" y="532" class="body">coordMap, idMap</text>
<text x="1100" y="546" class="body">+ GetTile()/IsFree()</text>
<text x="1100" y="560" class="body">+ GetOrthogonalNeighbours()</text>

<rect x="1090" y="600" width="240" height="60" class="box"/>
<text x="1100" y="618" class="title">GridSquare</text>
<text x="1100" y="632" class="body">tileX, tileY, State, ItemType</text>
<text x="1100" y="646" class="body">+ PlaceItem()/ClearItem()</text>

<path d="M1210,600 L1210,576" class="assoc"/>
</g>

<g>
<rect x="1380" y="50" width="290" height="76" class="box"/>
<text x="1390" y="68" class="title">GameEventSingleton</text>
<text x="1390" y="82" class="body">OnPlayerDied, OnHealthChanged,</text>
<text x="1390" y="96" class="body">OnPlayerTurnStart/End,</text>
<text x="1390" y="110" class="body">OnCharacterAttacked...</text>

<rect x="1380" y="150" width="135" height="36" class="box"/>
<text x="1388" y="168" class="title" font-size="11">GameEvent</text>
<rect x="1525" y="150" width="145" height="36" class="box"/>
<text x="1533" y="168" class="title" font-size="11">TypedGameEvent&lt;T&gt;</text>
<path d="M1450,150 L1450,126" class="assoc"/>
<path d="M1597,150 L1500,126" class="assoc"/>
</g>

<g>
<rect x="1380" y="230" width="230" height="56" class="box"/>
<text x="1390" y="248" class="title">GameManager «singleton»</text>
<text x="1390" y="262" class="body">→ combatManager</text>
<path d="M1380,260 L320,560" class="assoc" stroke-dasharray="3,2"/>
</g>

<g>
<rect x="20" y="800" width="220" height="78" class="box"/>
<text x="30" y="818" class="title">TeamBoardUI</text>
<text x="30" y="832" class="body">rosterTeam, combatTeam</text>
<text x="30" y="846" class="body">→ Dictionary&lt;Character,</text>
<text x="30" y="860" class="body">  CharacterCardUI&gt;</text>

<rect x="280" y="800" width="220" height="78" class="box"/>
<text x="290" y="818" class="title">CharacterCardUI</text>
<text x="290" y="832" class="body">→ CharacterStats</text>
<text x="290" y="846" class="body">→ StatusEffectHandler</text>
<text x="290" y="860" class="body">+ Bind(Character)</text>

<rect x="540" y="800" width="200" height="54" class="box"/>
<text x="550" y="818" class="title">HealthBar</text>
<text x="550" y="832" class="body">→ CharacterStats</text>
<text x="550" y="846" class="body">+ UpdateUI(hp,max)</text>

<rect x="780" y="800" width="200" height="54" class="box"/>
<text x="790" y="818" class="title">AttackButton</text>
<text x="790" y="832" class="body">→ PlayerController</text>
<text x="790" y="846" class="body">→ CharacterActionSO</text>

<rect x="280" y="900" width="220" height="40" class="box"/>
<text x="290" y="918" class="title">StatusEffectIconUI</text>
<text x="290" y="932" class="body">+ Set(ActiveStatusEffect)</text>

<path d="M280,838 L240,838" class="assoc"/>
<path d="M390,900 L390,878" class="assoc"/>
<path d="M640,800 L450,330" class="assoc" stroke-dasharray="3,2"/>
</g>

<text x="20" y="1010" class="sec" font-size="12">Notes:</text>
<text x="20" y="1030" class="body" font-size="11">• Character implements ITarget; PlayerController drives PlayerCharacter via PlayerTeam, AIController drives AICharacter via CombatManager.</text>
<text x="20" y="1048" class="body" font-size="11">• CombatManager orchestrates Team/TargetManager; CharacterActionSO/SkillSO are ScriptableObject-based data-driven actions executed on ITarget lists.</text>
<text x="20" y="1066" class="body" font-size="11">• Token/Slot/Merger system (CharacterToken, CharacterSlot, CharacterTokenMerger) implements the new "merge combat" mechanic replacing the old Dice system.</text>
<text x="20" y="1084" class="body" font-size="11">• GameEventSingleton provides a decoupled pub/sub layer (GameEvent / TypedGameEvent&lt;T&gt;) used across UI, Controllers, and Combat.</text>
</svg>
