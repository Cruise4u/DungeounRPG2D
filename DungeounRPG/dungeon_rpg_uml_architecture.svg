<text x="990" y="261" class="body">ApplyEffect()</text>

<rect x="980" y="290" width="150" height="36" class="box"/>
<text x="990" y="308" class="title">StunSE</text>
<text x="990" y="321" class="body">stunRounds</text>
<path d="M1040,290 L1040,266" class="inh"/>

