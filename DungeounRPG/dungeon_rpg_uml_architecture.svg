<g>
<rect x="560" y="500" width="230" height="50" class="box"/>
<text x="570" y="518" class="title">CharacterController (abstr.)</text>
<text x="570" y="532" class="body">+ ConfirmAction(...)</text>

<rect x="560" y="580" width="230" height="120" class="box"/>
<text x="570" y="598" class="title">PlayerController</text>
